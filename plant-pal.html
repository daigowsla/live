function slime(x,y,sx,sy,eyes,look){
  P.save();P.translate(Math.round(x),Math.round(y));P.scale(sx,sy);
  const rows=['......333333......','....3322222233....','...322222222223...','..32221111122223..','.3221111111122223.','322111111111122223','321111111111112223','321111111111112223','322111111111122223','.3221111111122223.','..32222222222223..','...333333333333...'];

  rows.forEach((row,j)=>[...row].forEach((v,i)=>{if(colors[v])p(i*3-27,j*3-35,3,3,colors[v])}));
  p(-18,-29,9,6,'#baf4c8');p(-21,-26,6,9,'#8be9a9');p(12,-3,9,3,'#218457');
  if(eyes==='closed'){p(-15,-14,9,3,'#102c31');p(7,-14,9,3,'#102c31');p(-12,-11,6,2,'#174047');p(10,-11,6,2,'#174047')}
  else{p(-15+look,-17,8,12,'#101b35');p(8+look,-17,8,12,'#101b35');if(eyes!=='blink'){p(-13+look,-15,3,3,'#fff');p(10+look,-15,3,3,'#fff')}}
  P.restore();

function animateIdle(){
  paintDesert();const t=Date.now()/1000,sleeping=S.light<150,phase=t%12;
  if(sleeping){const breathe=Math.sin(t*1.35)*.025;slime(160,174,1.18+breathe,.72-breathe*.4,'closed',0);p(198,125,3,3,'#fff');p(201,121,6,3,'#fff');p(207,117,3,3,'#fff');p(211,107,3,3,'#fff');p(214,103,7,3,'#fff');p(221,99,3,3,'#fff')}
  else{
    let x=160,y=169,sx=1,sy=1,look=0,eyes='open';
    const breath=Math.sin(t*2.1)*.025;sx+=breath;sy-=breath;
    if(phase>3&&phase<5){look=phase<4?-2:2;x+=Math.sin((phase-3)*Math.PI)*2}
    if(phase>6.2&&phase<6.45)eyes='blink';
    if(phase>8&&phase<8.65){let q=(phase-8)/.65,h=Math.sin(q*Math.PI)*10;y-=h;sx+=Math.sin(q*Math.PI)*.06;sy-=Math.sin(q*Math.PI)*.04}

  }
  requestAnimationFrame(animateIdle);
}

function startPetReaction(event){
  event.preventDefault();
  const bounds=portrait.getBoundingClientRect(),px=(event.clientX-bounds.left)*360/bounds.width,py=(event.clientY-bounds.top)*360/bounds.height;
  if(px<72||px>288||py<72||py>322)return;
  const now=Date.now();
  if(now<sulkingUntil){ensureGameAudio();playAngryEffectSound(true);sulkingUntil=now+60000;return}
  tapHistory=tapHistory.filter(stamp=>now-stamp<=30000);tapHistory.push(now);
  tapFxX=px;tapFxY=py;tapFxUntil=Date.now()+700;
  ensureGameAudio();
  if(tapHistory.length>=21){sulkingUntil=now+60000;angryUntil=0;petReactionUntil=0;playAngryEffectSound(true);return}
  if(tapHistory.length===16){angryUntil=now+2000;petReactionUntil=0;playAngryEffectSound(false);return}
  if(now<angryUntil){playAngryEffectSound(false);return}
  playTapEffectSound();
  let nextReaction;do{nextReaction=Math.floor(Math.random()*5)}while(nextReaction===petReactionKind);
  petReactionKind=nextReaction;petReactionUntil=Date.now()+1800;
}
portrait.addEventListener('pointerdown',startPetReaction,{passive:false});
portrait.addEventListener('dblclick',event=>event.preventDefault(),{passive:false});
function reactionPixels(kind,progress){

  if(kind===0){qrect(273,177-rise,4,4,pink);qrect(281,177-rise,4,4,pink);qrect(269,181-rise,20,4,pink);qrect(273,185-rise,12,4,pink);qrect(277,189-rise,4,4,pink)}
  else if(kind===1){qrect(86,155-rise,4,13,pink);qrect(82,159-rise,13,4,pink);qrect(88,151-rise,4,4,pink);qrect(88,168-rise,4,4,pink)}
  else if(kind===2){qrect(83,174-rise,4,4,pink);qrect(91,166-rise,4,4,pink);qrect(99,174-rise,4,4,pink);qrect(91,182-rise,4,4,pink)}
  else if(kind===3){qrect(105,242-rise,12,5,'#e9948d');qrect(242,242-rise,12,5,'#e9948d');qrect(109,247-rise,5,3,'#f6b1a5');qrect(246,247-rise,5,3,'#f6b1a5')}
  else{qrect(176,128-rise,5,19,pink);qrect(169,135-rise,19,5,pink);qrect(172,131-rise,13,13,'#fffbd0');qrect(176,135-rise,5,5,'#ffffff')}
}
function drawTapGlow(nowMs){
  if(nowMs>=tapFxUntil)return;
  const progress=1-(tapFxUntil-nowMs)/700,radius=7+progress*29,size=Math.max(2,Math.round(5-progress*2));
  Q.save();Q.globalAlpha=Math.max(0,1-progress);
  const color=progress<.45?'#fffbd0':'#bff4b1';
  for(let i=0;i<12;i++){const angle=i*Math.PI/6,x=tapFxX+Math.cos(angle)*radius,y=tapFxY+Math.sin(angle)*radius;qrect(x-size/2,y-size/2,size,size,color)}
  qrect(tapFxX-2,tapFxY-2,4,4,'#ffffff');Q.restore();
}

let audioContext=null,audioMaster=null,bgmStarted=false,bgmTimer=0,bgmNextStart=0;
function noteFrequency(midi){return 440*Math.pow(2,(midi-69)/12)}
function synthTone(frequency,start,duration,volume,type='square'){
  if(!audioContext||!audioMaster)return;
  const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();
  oscillator.type=type;oscillator.frequency.setValueAtTime(frequency,start);
  gain.gain.setValueAtTime(.0001,start);gain.gain.linearRampToValueAtTime(volume,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
  oscillator.connect(gain);gain.connect(audioMaster);oscillator.start(start);oscillator.stop(start+duration+.02);
}
function scheduleBgmLoop(){
  if(!audioContext||!bgmStarted)return;
  const step=.46875,start=Math.max(audioContext.currentTime+.06,bgmNextStart||0);bgmNextStart=start+15;
  const melody=[72,0,76,79,76,0,74,0,69,0,72,76,74,0,71,0,67,0,71,74,72,0,69,0,64,0,67,71,69,0,67,0];
  const bass=[48,43,45,40,48,43,45,47,41,43,45,40,43,38,40,48];
  melody.forEach((note,index)=>{if(note)synthTone(noteFrequency(note),start+index*step,step*.8,.05,'square')});
  bass.forEach((note,index)=>synthTone(noteFrequency(note),start+index*step*2,step*1.7,.065,'triangle'));
  for(let index=0;index<32;index+=8)synthTone(110,start+index*step,.055,.018,'square');
  clearTimeout(bgmTimer);bgmTimer=setTimeout(scheduleBgmLoop,Math.max(1000,(bgmNextStart-audioContext.currentTime-.5)*1000));
}
function ensureGameAudio(){
  const AudioEngine=window.AudioContext||window.webkitAudioContext;if(!AudioEngine)return;
  if(!audioContext){audioContext=new AudioEngine();audioMaster=audioContext.createGain();audioMaster.gain.value=.3;audioMaster.connect(audioContext.destination)}
  audioContext.resume();
  if(!bgmStarted){bgmStarted=true;audioMaster.gain.setValueAtTime(.3,audioContext.currentTime);scheduleBgmLoop()}
}
function playTapEffectSound(){
  if(!audioContext)return;
  const now=audioContext.currentTime;synthTone(523.25,now,.09,.15,'square');synthTone(783.99,now+.065,.16,.13,'square');
}
function playAngryEffectSound(strong){
  if(!audioContext)return;
  const now=audioContext.currentTime;synthTone(strong?174.61:220,now,.16,strong ? .2 : .14,'sawtooth');synthTone(strong?130.81:164.81,now+.1,.24,strong ? .22 : .15,'square');
}
function drawSulkBubble(){
  const outline='#242026',paper='#fffdf5';
  qrect(276,160,12,12,outline);qrect(272,168,12,8,outline);qrect(268,174,8,5,outline);
  qrect(275,112,54,4,outline);qrect(269,116,66,4,outline);qrect(265,120,74,40,outline);qrect(269,160,66,4,outline);qrect(275,164,54,4,outline);
  qrect(275,116,54,4,paper);qrect(269,120,66,40,paper);qrect(275,160,54,4,paper);
  qrect(280,160,4,8,paper);qrect(276,168,4,4,paper);
  const mark='#242026';
  Q.save();Q.translate(301,140);Q.rotate(Math.PI/4);
  qrect(-5,-14,3,12,mark);qrect(-12,-5,10,3,mark);
  qrect(2,-14,3,12,mark);qrect(2,-5,10,3,mark);
  qrect(-12,2,10,3,mark);qrect(-5,2,3,12,mark);
  qrect(2,2,10,3,mark);qrect(2,2,3,12,mark);
  Q.restore();
}
function portraitAnimation(){
  const nowMs=Date.now(),plantDate=new Date(nowMs+9*60*60*1000),plantHour=plantDate.getUTCHours()+plantDate.getUTCMinutes()/60;
  const sleeping=Number.isFinite(W.sunrise)&&Number.isFinite(W.sunset)&&W.sunrise>0?nowMs<W.sunrise||nowMs>W.sunset+60*60*1000:plantHour>=19||plantHour<6,t=nowMs/1000,phase=t%22;
  tapHistory=tapHistory.filter(stamp=>nowMs-stamp<=30000);
  const sulking=nowMs<sulkingUntil,angry=!sulking&&nowMs<angryUntil;
  portraitDesert();
  qrect(139,287,90,3,'#8a8790');qrect(119,290,130,3,'#6f6c75');qrect(105,293,158,6,'#57545d');qrect(105,299,158,6,'#57545d');qrect(119,305,130,3,'#6f6c75');qrect(139,308,90,3,'#8a8790');
  let x=180,y=295,sx=2.5,sy=2.5,eyes='open',look=0;
  const reacting=!sulking&&!angry&&nowMs<petReactionUntil,reactionProgress=reacting?1-(petReactionUntil-nowMs)/1800:0;
  if(sulking){
    const sulkBreath=Math.sin(t*1.1)*.018;sx+=sulkBreath;sy-=sulkBreath;y+=Math.sin(t*1.1)*.7;
    $('message').textContent='カリバナスは　すねている……。';

  }else if(angry){

    $('message').textContent='カリバナスは　おこっている！';
    beigeSlime(x,y,sx,sy,eyes,0);
  }else if(sleeping){
    const breath=Math.sin(t*1.25)*.025;y+=Math.sin(t*1.25)*1.2;sx=2.5+breath;sy=2.5-breath;eyes='closed';
    if(reacting){
      const sleepy=Math.sin(reactionProgress*Math.PI);
      if(petReactionKind===0){y-=Math.abs(Math.sin(reactionProgress*Math.PI*2))*3;$('message').textContent='カリバナスは　たのしい　ゆめをみている。'}
      else if(petReactionKind===1){sx-=sleepy*.035;sy+=sleepy*.055;$('message').textContent='カリバナスは　びくっと　うごいた。'}
      else if(petReactionKind===2){x+=Math.sin(reactionProgress*Math.PI*6)*2;$('message').textContent='カリバナスは　ねぼけて　ゆれた。'}
      else if(petReactionKind===3){x-=sleepy*2;sx-=sleepy*.025;$('message').textContent='カリバナスは　ねごとを　いっている。'}
      else{y-=sleepy*4;sx-=sleepy*.04;sy+=sleepy*.06;$('message').textContent='カリバナスの　はっぱが　ぴくり！'}
    }else $('message').textContent='カリバナスは　ぐっすり　ねむっている。';
    beigeSlime(x,y,sx,sy,eyes,0);qrect(281,179,4,4,'#fff4cf');qrect(285,173,9,4,'#fff4cf');qrect(294,167,4,4,'#fff4cf');qrect(301,152,4,4,'#fff4cf');qrect(305,146,11,4,'#fff4cf');qrect(316,140,4,4,'#fff4cf');
    if(reacting)reactionPixels(petReactionKind,reactionProgress);
  }else{
    $('message').textContent=S.moisture<35?'カリバナスは　みずを　ほしがっている。':S.temperature>32?'カリバナスは　あつさに　たえている！':'カリバナスは　こちらを　みている。';
    const breath=Math.sin(t*2)*.025;sx+=breath;sy-=breath;
    if(reacting){
      if(petReactionKind===0){const hop=Math.abs(Math.sin(reactionProgress*Math.PI*2));eyes='happy';y-=hop*10;sx+=hop*.06;sy-=hop*.04;$('message').textContent='カリバナスは　よろこんで　はねた！'}
      else if(petReactionKind===1){const pop=Math.sin(reactionProgress*Math.PI);eyes='wide';y-=pop*4;sx-=pop*.05;sy+=pop*.08;$('message').textContent='カリバナスは　びっくりしている！'}
      else if(petReactionKind===2){const wobble=Math.sin(reactionProgress*Math.PI*7)*(1-reactionProgress*.35);eyes='happy';x+=wobble*4;look=wobble>0?2:-2;$('message').textContent='カリバナスは　うれしそうに　ゆれた！'}
      else if(petReactionKind===3){const shy=Math.sin(reactionProgress*Math.PI);eyes=reactionProgress>.28&&reactionProgress<.76?'blink':'open';look=-3;x-=shy*3;sx-=shy*.045;sy+=shy*.035;$('message').textContent='カリバナスは　てれている……。'}
      else{const stretch=Math.sin(reactionProgress*Math.PI);eyes=reactionProgress<.3?'wide':'happy';y-=stretch*8;sx-=stretch*.08;sy+=stretch*.11;$('message').textContent='カリバナスは　ぐーんと　のびた！'}
    }else{
      if(phase>2&&phase<4.4){look=phase<3.2?-3:3;x+=Math.sin((phase-2)*Math.PI/2.4)*2}
      if(phase>5&&phase<5.25)eyes='blink';
      if(phase>6.3&&phase<7.7){eyes='happy';x+=Math.sin((phase-6.3)*Math.PI*2)*1.5;$('message').textContent='カリバナスは　うれしそうに　ゆれている。'}
      if(phase>9&&phase<9.78){const u=(phase-9)/.78,h=Math.sin(u*Math.PI)*14;y-=h;sx+=Math.sin(u*Math.PI)*.035;sy-=Math.sin(u*Math.PI)*.025}
      if(phase>=9.78&&phase<10.15){const u=(phase-9.78)/.37,k=Math.sin(u*Math.PI);sx+=k*.11;sy-=k*.09}
      if(phase>12&&phase<13.2){const k=Math.sin((phase-12)/1.2*Math.PI);sx-=k*.07;sy+=k*.1;y-=k*3;look=2}
      if(phase>14.2&&phase<14.8){const k=Math.sin((phase-14.2)*Math.PI*8)*(1-(phase-14.2)/.6);x+=k*1.5}
      if(phase>16.2&&phase<17.7){eyes='wide';look=Math.sin((phase-16.2)*2)*2;$('message').textContent='カリバナスは　そらを　みあげている。'}
      if(phase>18.5&&phase<20.2){look=-3;x-=Math.sin((phase-18.5)/1.7*Math.PI)*2}
